{% extends "base.html" %}

{% block topbar_links %}
  <span>{{ session.get("admin_username", "admin") }}</span>
  <a class="btn btn-outline btn-sm" href="{{ url_for('admin_logout') }}">Log out</a>
{% endblock %}

{% block content %}
<div class="admin-shell">
  <aside class="admin-sidebar">
    <a href="{{ url_for('admin_dashboard') }}" class="{{ 'active' if active == 'dashboard' }}">Dashboard</a>
    <a href="{{ url_for('admin_new_election') }}" class="{{ 'active' if active == 'new_election' }}">New election</a>
    <a href="{{ url_for('admin_voters') }}" class="{{ 'active' if active == 'voters' }}">Voters</a>
    <a href="{{ url_for('admin_departments') }}" class="{{ 'active' if active == 'departments' }}">Departments</a>
  </aside>
  <div class="admin-main">
    {% block admin_content %}{% endblock %}
  </div>
</div>
{% endblock %}
